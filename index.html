<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusKit Virtual Laboratory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 24px;
            background: #080d12;
            border-bottom: 1px solid #374151;
        }

        header h1 {
            margin: 0;
            color: #a3e635;
            font-size: 23px;
        }

        header p {
            color: #aab4c0;
            margin-bottom: 0;
        }

        .lab-container {
            padding: 20px;
        }

        .lab-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            background: #a3e635;
            color: #101820;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #bef264;
        }

        button.danger {
            background: #ef4444;
            color: white;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .lab-workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 270px;
            gap: 15px;
        }

        #lab-view {
            width: 100%;
            height: 65vh;
            min-height: 350px;
            border: 1px solid #46515d;
            border-radius: 10px;
            overflow: hidden;
            background: #101820;
            position: relative;
            touch-action: none;
        }

        #lab-view canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info-panel {
            background: #080d12;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 18px;
            height: fit-content;
        }

        .info-panel h2 {
            color: #a3e635;
            font-size: 18px;
            margin-top: 0;
        }

        .info-item {
            border-bottom: 1px solid #374151;
            padding: 12px 0;
        }

        .info-label {
            color: #9ca3af;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }

        .info-value {
            color: white;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .panel-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
        }

        .panel-actions button {
            padding: 9px 6px;
            font-size: 12px;
        }

        #lab-status {
            margin-top: 15px;
            color: #a3e635;
        }

        @media (max-width: 750px) {
            .lab-workspace {
                grid-template-columns: 1fr;
            }

            #lab-view {
                height: 55vh;
            }
        }

        @media (max-width: 600px) {
            .lab-container {
                padding: 12px;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CampusKit Virtual Laboratory</h1>
    <p>Interactive 3D Science Laboratory</p>
</header>

<main class="lab-container">

    <div class="lab-toolbar">

        <button id="add-equipment">+ Add Equipment</button>

        <button id="duplicate-equipment">Duplicate</button>

        <button id="reset-camera">Reset View</button>

        <button id="stop-lab">Stop Animation</button>

        <button id="start-lab">Start Animation</button>

    </div>

    <div class="lab-workspace">

        <div id="lab-view"></div>

        <aside class="info-panel">

            <h2>Equipment Details</h2>

            <div class="info-item">
                <span class="info-label">Equipment Name</span>
                <span class="info-value" id="equipment-name">
                    Nothing selected
                </span>
            </div>

            <div class="info-item">
                <span class="info-label">Dimensions</span>
                <span class="info-value" id="equipment-size">---</span>
            </div>

            <div class="info-item">
                <span class="info-label">Position (X, Y, Z)</span>
                <span class="info-value" id="equipment-position">---</span>
            </div>

            <div class="info-item">
                <span class="info-label">Rotation (X, Y, Z)</span>
                <span class="info-value" id="equipment-rotation">---</span>
            </div>

            <div class="info-item">
                <span class="info-label">Selection</span>
                <span class="info-value" id="equipment-selection">
                    Not selected
                </span>
            </div>

            <div class="panel-actions">

                <button id="rotate-left">Rotate Left</button>

                <button id="rotate-right">Rotate Right</button>

                <button id="reset-position">Reset Position</button>

                <button id="delete-equipment" class="danger">
                    Delete
                </button>

            </div>

        </aside>

    </div>

    <p id="lab-status">Initializing laboratory...</p>

</main>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import { createLabScene } from "./engine/core/scene.js";

    import { createRenderer } from "./engine/core/renderer.js";

    import { createLabCamera } from "./engine/core/camera.js";

    import { createAnimationLoop } from "./engine/core/animation.js";

    import { createLabEnvironment } from "./engine/core/environment.js";

    import {
        createEquipment,
        duplicateEquipment,
        disposeEquipment
    } from "./engine/core/equipment.js";

    import { createInteractionManager } from "./engine/core/interaction.js";


    const container = document.getElementById("lab-view");

    const status = document.getElementById("lab-status");

    const nameElement = document.getElementById("equipment-name");

    const sizeElement = document.getElementById("equipment-size");

    const positionElement = document.getElementById("equipment-position");

    const rotationElement = document.getElementById("equipment-rotation");

    const selectionElement = document.getElementById("equipment-selection");


    let labScene;
    let labRenderer;
    let labCamera;
    let labEnvironment;
    let animation;
    let interaction;

    let equipmentCounter = 1;


    function updateEquipmentPanel(object) {

        if (!object) {

            nameElement.textContent = "Nothing selected";

            sizeElement.textContent = "---";

            positionElement.textContent = "---";

            rotationElement.textContent = "---";

            selectionElement.textContent = "Not selected";

            return;
        }

        const size = object.userData.size || [];

        nameElement.textContent =
            object.userData.equipmentName || object.name;

        sizeElement.textContent =
            size.length === 3
                ? `${size[0]} × ${size[1]} × ${size[2]} units`
                : "Not available";

        positionElement.textContent =
            `X: ${object.position.x.toFixed(2)}, ` +
            `Y: ${object.position.y.toFixed(2)}, ` +
            `Z: ${object.position.z.toFixed(2)}`;

        rotationElement.textContent =
            `X: ${THREE.MathUtils.radToDeg(object.rotation.x).toFixed(1)}°, ` +
            `Y: ${THREE.MathUtils.radToDeg(object.rotation.y).toFixed(1)}°, ` +
            `Z: ${THREE.MathUtils.radToDeg(object.rotation.z).toFixed(1)}°`;

        selectionElement.textContent = "Selected";
    }


    function showStatus(message) {
        status.textContent = message;
    }


    try {

        labScene = createLabScene();

        labRenderer = createRenderer(container);

        labCamera = createLabCamera(container);

        labEnvironment = createLabEnvironment(labScene.scene);


        const initialEquipment = createEquipment({

            name: "Test Laboratory Equipment",

            color: 0xa3e635,

            size: [1, 1, 1],

            position: [0, 2, 0]

        });

        labScene.scene.add(initialEquipment);


        interaction = createInteractionManager(

            labRenderer.renderer.domElement,

            labCamera.camera,

            labScene.scene

        );


        const canvas = labRenderer.renderer.domElement;


        canvas.addEventListener("lab-object-selected", event => {

            const object = event.detail.object;

            updateEquipmentPanel(object);

            showStatus(
                object
                    ? `Selected: ${object.userData.equipmentName}`
                    : "No equipment selected."
            );

        });


        canvas.addEventListener("lab-object-moved", event => {

            updateEquipmentPanel(event.detail.object);

        });


        document.getElementById("add-equipment").addEventListener(
            "click",
            () => {

                equipmentCounter++;

                const equipment = createEquipment({

                    name: `Laboratory Equipment ${equipmentCounter}`,

                    color: 0x8fa3b8,

                    size: [1, 1, 1],

                    position: [
                        (equipmentCounter % 4) * 1.5,
                        2,
                        0
                    ]

                });

                interaction.addEquipment(equipment);

                interaction.selectObject(equipment);

                showStatus("New equipment added.");

            }
        );


        document.getElementById("duplicate-equipment").addEventListener(
            "click",
            () => {

                const selected = interaction.getSelectedObject();

                if (!selected) {
                    showStatus("Select equipment before duplicating.");
                    return;
                }

                const copy = duplicateEquipment(selected);

                if (copy) {

                    equipmentCounter++;

                    copy.userData.equipmentName =
                        `Laboratory Equipment ${equipmentCounter}`;

                    copy.name = copy.userData.equipmentName;

                    interaction.addEquipment(copy);

                    interaction.selectObject(copy);

                    showStatus("Equipment duplicated.");

                }

            }
        );


        document.getElementById("delete-equipment").addEventListener(
            "click",
            () => {

                const selected = interaction.getSelectedObject();

                if (!selected) {
                    showStatus("Select equipment before deleting.");
                    return;
                }

                interaction.deleteSelected();

                updateEquipmentPanel(null);

                showStatus("Equipment deleted.");

            }
        );


        document.getElementById("rotate-left").addEventListener(
            "click",
            () => {

                if (interaction.rotateSelected("y", -Math.PI / 4)) {

                    updateEquipmentPanel(
                        interaction.getSelectedObject()
                    );

                    showStatus("Equipment rotated left.");

                } else {
                    showStatus("Select equipment before rotating.");
                }

            }
        );


        document.getElementById("rotate-right").addEventListener(
            "click",
            () => {

                if (interaction.rotateSelected("y", Math.PI / 4)) {

                    updateEquipmentPanel(
                        interaction.getSelectedObject()
                    );

                    showStatus("Equipment rotated right.");

                } else {
                    showStatus("Select equipment before rotating.");
                }

            }
        );


        document.getElementById("reset-position").addEventListener(
            "click",
            () => {

                if (interaction.resetSelected()) {

                    updateEquipmentPanel(
                        interaction.getSelectedObject()
                    );

                    showStatus("Equipment position reset.");

                } else {
                    showStatus("Select equipment before resetting.");
                }

            }
        );


        document.getElementById("reset-camera").addEventListener(
            "click",
            () => {

                labCamera.camera.position.set(0, 5, 12);

                labCamera.controls.target.set(0, 1, 0);

                labCamera.controls.update();

                showStatus("Camera view reset.");

            }
        );


        document.getElementById("stop-lab").addEventListener(
            "click",
            () => {
                animation.stop();
                showStatus("Laboratory animation stopped.");
            }
        );


        document.getElementById("start-lab").addEventListener(
            "click",
            () => {
                animation.start();
                showStatus("Laboratory animation running.");
            }
        );


        animation = createAnimationLoop(

            labRenderer.renderer,

            labScene.scene,

            labCamera.camera

        );

        animation.start();


        window.addEventListener("beforeunload", () => {

            animation?.dispose();

            interaction?.dispose();

            labCamera?.dispose();

            labEnvironment?.dispose();

            labScene?.dispose();

            labRenderer?.dispose();

        });


        showStatus("Laboratory ready. Add or select equipment.");


    } catch (error) {

        console.error(error);

        showStatus("Laboratory error: " + error.message);

    }

</script>

</body>
</html>

}

android {
    namespace 'app.campuskit'
    compileSdk 35

    defaultConfig {
        applicationId 'app.campuskit'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
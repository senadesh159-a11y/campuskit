<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusKit | Virtual Laboratory</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d0b;color:#eaf2eb;font-family:Arial,sans-serif;overflow:hidden}
#lab{position:fixed;inset:0}
canvas{display:block}
#topbar{
 position:fixed;top:0;left:0;right:0;height:65px;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 24px;background:rgba(5,12,8,.82);
 border-bottom:1px solid #304333;backdrop-filter:blur(14px);
 z-index:5
}
.logo{font-size:18px;font-weight:800;letter-spacing:1px}
.logo span{color:#b7f34a}
#status{font-size:12px;color:#b7f34a}
#controls{
 position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
 display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
 width:min(95%,700px);z-index:5
}
button{
 background:rgba(15,26,18,.94);color:#eaf2eb;
 border:1px solid #405344;border-radius:9px;
 padding:11px 15px;cursor:pointer
}
button:hover{border-color:#b7f34a;color:#b7f34a}
#help{
 position:fixed;left:20px;bottom:25px;z-index:5;
 background:rgba(5,12,8,.8);padding:13px 16px;
 border:1px solid #304333;border-radius:10px;
 color:#aab9ac;font-size:12px;line-height:1.8
}
#loading{
 position:fixed;inset:0;display:grid;place-items:center;
 background:#080d0b;z-index:10;color:#b7f34a;
 font-size:14px;letter-spacing:2px
}
#crosshair{
 position:fixed;left:50%;top:50%;width:5px;height:5px;
 border-radius:50%;background:#b7f34a;opacity:.45;
 pointer-events:none
}
@media(max-width:600px){
 #topbar{padding:0 12px}
 #help{display:none}
 button{padding:10px;font-size:12px}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="loading">INITIALIZING LABORATORY...</div>
<div id="lab"></div>

<header id="topbar">
 <div class="logo">CAMPUS<span>KIT</span> / LABORATORY</div>
 <div id="status">● 3D ENVIRONMENT ONLINE</div>
</header>

<div id="crosshair"></div>

<div id="help">
 DRAG — ROTATE VIEW<br>
 SCROLL — ZOOM IN / OUT<br>
 RIGHT DRAG — PAN CAMERA<br>
 DOUBLE CLICK — FOCUS VIEW
</div>

<div id="controls">
 <button id="reset">Reset View</button>
 <button id="top">Top View</button>
 <button id="front">Front View</button>
 <button id="fullscreen">Fullscreen</button>
 <button id="quality">4K Mode</button>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const container=document.getElementById("lab");

const scene=new THREE.Scene();
scene.background=new THREE.Color("#101914");
scene.fog=new THREE.Fog("#101914",18,65);

const camera=new THREE.PerspectiveCamera(
 55,window.innerWidth/window.innerHeight,.1,150
);
camera.position.set(12,10,16);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=3;
controls.maxDistance=35;
controls.maxPolarAngle=Math.PI*.49; controls.enablePan=true; controls.screenSpacePanning=true; controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE; controls.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY; controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
controls.target.set(0,2,0);

scene.add(new THREE.HemisphereLight("#dcecff","#263526",2));

const mainLight=new THREE.DirectionalLight("#fff2d7",3);
mainLight.position.set(8,15,8);
mainLight.castShadow=true;
mainLight.shadow.mapSize.set(2048,2048);
scene.add(mainLight);

function material(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({
  color,roughness,metalness
 });
}

const floorMat=material("#39443d",.82);
const wallMat=material("#87918a");
const darkMat=material("#202b24");
const metalMat=material("#aab7b0",.3,.8);
const greenMat=material("#b7f34a",.35,.15);
const glassMat=new THREE.MeshPhysicalMaterial({
 color:"#b8d9c8",transparent:true,opacity:.2,
 roughness:.08,metalness:.1
});

function box(name,x,y,z,sx,sy,sz,mat,shadow=true){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),mat
 );
 mesh.name=name;
 mesh.position.set(x,y,z);
 mesh.castShadow=shadow;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

function cylinder(name,x,y,z,r1,r2,height,mat){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,height,32),mat
 );
 mesh.name=name;
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 scene.add(mesh);
 return mesh;
}

// FLOOR
box("Laboratory Floor",0,-.2,0,30,.4,30,floorMat);

// FLOOR GRID
const grid=new THREE.GridHelper(30,30,"#829487","#53645a");
grid.position.y=.015;
scene.add(grid);

// WALLS
box("Back Wall",0,5,-15,30,10,.35,wallMat);
box("Left Wall",-15,5,0,.35,10,30,wallMat);
box("Right Wall",15,5,0,.35,10,30,wallMat);

// CEILING
box("Ceiling",0,10,0,30,.3,30,darkMat);

// WALL PANELS
for(let x=-12;x<=12;x+=4){
 box("Wall Panel",x,5,-14.78,3.5,7,.08,darkMat,false);
 box("Panel Accent",x,8.5,-14.7,3.5,.06,.06,greenMat,false);
}

// LABORATORY BENCHES
function bench(x,z){
 box("Bench Top",x,2.1,z,7,.22,2.1,material("#343d37",.28,.35));
 for(const dx of [-3,3]){
  for(const dz of [-.75,.75]){
   box("Bench Leg",x+dx,1,z+dz,.16,2,.16,metalMat);
  }
 }
 box("Bench Storage",x,1.55,z,2.2,.85,1.5,darkMat);
}

bench(-7,-5);
bench(7,-5);
bench(-7,5);
bench(7,5);

// STORAGE CABINETS
for(let i=0;i<4;i++){
 box("Storage Cabinet",-12,1.7,-8+i*4,2.1,3.4,2.2,darkMat);
 box("Cabinet Door",-10.92,1.7,-8+i*4,.05,3.1,1.8,metalMat);
}

// GLASS WINDOWS
for(let i=0;i<3;i++){
 const windowMesh=box(
  "Laboratory Window",0,6,-14.55,3.5,2.8,.12,glassMat,false
 );
 windowMesh.position.x=-7+i*7;
}

// LIGHT PANELS
for(let x=-9;x<=9;x+=6){
 const light=box("Ceiling Light",x,9.65,0,3,.08,1.2,
  new THREE.MeshBasicMaterial({color:"#fff4d2"}),false
 );
 const glow=new THREE.PointLight("#fff0ce",25,12);
 glow.position.set(x,9,0);
 scene.add(glow);
}

// DIGITAL DISPLAY
box("Display Frame",0,5,-14.35,6,3.5,.35,darkMat);
box("Display Screen",0,5,-14.13,5.7,3.15,.08,
 new THREE.MeshBasicMaterial({color:"#13251b"}));

for(let i=0;i<5;i++){
 box("Screen Indicator",-2.1+i*1.05,3.8,-14.06,.55,.06,.04,greenMat,false);
}

// GENERIC LAB EQUIPMENT PLACEHOLDERS
// These are environmental props, not experiments.
function equipment(x,z){
 cylinder("Instrument Base",x,2.28,z,.55,.55,.16,metalMat);

 cylinder("Instrument Column",x,2.95,z,.09,.09,1.2,metalMat);

 box("Instrument Head",x,3.62,z,.75,.35,.5,darkMat);

 box("Instrument Display",x,3.64,z+.26,.4,.19,.025,
  new THREE.MeshBasicMaterial({color:"#b7f34a"}),false);
}

equipment(-7,-5);
equipment(7,-5);
equipment(-7,5);
equipment(7,5);


function labLabel(text,x,y,z){
 const c=document.createElement('canvas');c.width=512;c.height=100;const q=c.getContext('2d');
 q.fillStyle='#101b14';q.strokeStyle='#b7f34a';q.lineWidth=5;q.roundRect(5,5,502,90,16);q.fill();q.stroke();
 q.font='bold 30px Arial';q.fillStyle='#f4f8ef';q.textAlign='center';q.fillText(text,256,62);
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx}));sp.position.set(x,y,z);sp.scale.set(3.5,.7,1);scene.add(sp);
}
function labRod(g,a,b,r,col){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),v=B.clone().sub(A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),18),material(col,.35,.55));
 m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());m.castShadow=true;g.add(m);return m;
}
function labStation(x,z,title){
 const g=new THREE.Group();g.position.set(x,2.22,z);scene.add(g);
 const p=new THREE.Mesh(new THREE.BoxGeometry(3.7,.12,1.55),material('#202a24',.3,.45));p.position.y=.12;p.castShadow=true;g.add(p);
 labLabel(title,x,4.7,z-1);return g;
}
// Physics optics bench: rail, scale, glass prism and beam source.
{
 const g=labStation(-7,-5,'PHYSICS • OPTICS / MECHANICS');
 const rail=new THREE.Mesh(new THREE.BoxGeometry(3.1,.08,.18),metalMat);rail.position.set(0,.3,0);g.add(rail);
 for(let i=0;i<25;i++){const t=new THREE.Mesh(new THREE.BoxGeometry(.018,.05,.2),greenMat);t.position.set(-1.5+i*.125,.36,0);g.add(t)}
 const sh=new THREE.Shape();sh.moveTo(0,.95);sh.lineTo(-.72,-.55);sh.lineTo(.72,-.55);sh.closePath();
 const pr=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:true,bevelSegments:3,bevelSize:.04,bevelThickness:.04}),new THREE.MeshPhysicalMaterial({color:'#a8eaff',transparent:true,opacity:.48,roughness:.08,transmission:.4,ior:1.52,clearcoat:1}));
 pr.position.set(-.15,.85,-.25);g.add(pr);
 const src=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.5,24),metalMat);src.rotation.z=Math.PI/2;src.position.set(-1.35,.85,0);g.add(src);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1.15,12),new THREE.MeshBasicMaterial({color:'#fff1c8'}));beam.rotation.z=Math.PI/2;beam.position.set(-.85,.88,0);g.add(beam);
}
// Chemistry titration bench: burette, stopcock and indicator flask.
{
 const g=labStation(7,-5,'CHEMISTRY • TITRATION / VISCOSITY');
 const glass=new THREE.MeshPhysicalMaterial({color:'#a9e8ff',transparent:true,opacity:.3,roughness:.08,transmission:.4,side:THREE.DoubleSide});
 const bu=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,1.8,24,1,true),glass);bu.position.set(-.7,1.15,0);g.add(bu);
 for(let i=0;i<12;i++){const t=new THREE.Mesh(new THREE.BoxGeometry(i%3===0?.14:.07,.014,.025),material('#f2fbff'));t.position.set(-.6,1.9-i*.13,.02);g.add(t)}
 labRod(g,[-.7,.25,0],[-.7,.02,0],.025,'#c9d8e2');
 const tap=new THREE.Mesh(new THREE.BoxGeometry(.28,.06,.06),greenMat);tap.position.set(-.7,.14,0);g.add(tap);
 const flask=new THREE.Mesh(new THREE.ConeGeometry(.5,.95,32,1,true),glass);flask.position.set(.55,.45,0);flask.rotation.z=Math.PI;g.add(flask);
 const liquid=new THREE.Mesh(new THREE.CylinderGeometry(.28,.2,.18,24),new THREE.MeshStandardMaterial({color:'#b87aff',transparent:true,opacity:.72}));liquid.position.set(.55,.37,0);g.add(liquid);
}
// Biology microscope with eyepiece, stage, objective and focus knob.
{
 const g=labStation(-7,5,'BIOLOGY • MICROSCOPY / LIFE SCIENCE');
 const dark=material('#20272a',.28,.65);
 labRod(g,[-.55,.35,0],[-.15,1.5,0],.13,'#20272a');labRod(g,[-.15,1.5,0],[.35,1.72,0],.11,'#20272a');
 const ey=new THREE.Mesh(new THREE.CylinderGeometry(.16,.12,.34,24),metalMat);ey.rotation.z=-.7;ey.position.set(.43,1.85,0);g.add(ey);
 const stage=new THREE.Mesh(new THREE.BoxGeometry(1.35,.1,.8),metalMat);stage.position.set(.05,.7,0);g.add(stage);
 const slide=new THREE.Mesh(new THREE.BoxGeometry(.75,.025,.34),glassMat);slide.position.set(.05,.77,0);g.add(slide);
 labRod(g,[.2,1.1,0],[.25,.85,0],.07,'#aab7b0');
 const knob=new THREE.Mesh(new THREE.TorusGeometry(.22,.05,12,32),greenMat);knob.position.set(-.7,.95,.18);g.add(knob);
}
// Mathematics 3D axes/vector and a solid of revolution.
{
 const g=labStation(7,5,'MATHEMATICS • 3D MODELLING');
 labRod(g,[-1.2,.35,0],[1.2,.35,0],.025,'#b7f34a');labRod(g,[-1.2,.35,0],[-1.2,1.6,0],.025,'#ffb34a');labRod(g,[-1.2,.35,0],[-1.2,.35,-1],.025,'#42cfff');
 labRod(g,[-1.2,.35,0],[.7,1.35,-.7],.055,'#62d6ff');
 const pts=[];for(let i=0;i<=32;i++){const y=-.65+i*.04;pts.push(new THREE.Vector2(.25+.42*Math.sin(i/32*Math.PI),y))}
 const solid=new THREE.Mesh(new THREE.LatheGeometry(pts,40),new THREE.MeshPhysicalMaterial({color:'#b7f34a',transparent:true,opacity:.75,metalness:.2,roughness:.25}));solid.position.set(.8,.9,.15);g.add(solid);
}
// Anthropology teaching skeleton / skull model.
{
 const g=labStation(0,5,'ANTHROPOLOGY • HUMAN ANATOMY');const bone=material('#e8dfc9',.75);
 labRod(g,[0,.4,0],[0,1.55,0],.09,'#e8dfc9');
 for(let y=.65;y<1.35;y+=.23){const rib=new THREE.Mesh(new THREE.TorusGeometry(.34,.04,10,32),bone);rib.position.set(0,y,0);rib.rotation.x=Math.PI/2;g.add(rib)}
 labRod(g,[0,1.3,0],[-.48,.9,0],.055,'#e8dfc9');labRod(g,[0,1.3,0],[.48,.9,0],.055,'#e8dfc9');
 labRod(g,[-.48,.9,0],[-.58,.35,0],.05,'#e8dfc9');labRod(g,[.48,.9,0],[.58,.35,0],.05,'#e8dfc9');
 labRod(g,[0,.4,0],[-.28,-.35,0],.07,'#e8dfc9');labRod(g,[0,.4,0],[.28,-.35,0],.07,'#e8dfc9');
 const skull=new THREE.Mesh(new THREE.SphereGeometry(.25,24,18),bone);skull.position.set(0,1.8,0);g.add(skull);
}

// SAFETY SIGNS
box("Safety Sign",12,6,-14.7,2.5,1.5,.1,greenMat,false);

// ENVIRONMENTAL PARTICLES
const particleCount=500;
const positions=new Float32Array(particleCount*3);

for(let i=0;i<particleCount;i++){
 positions[i*3]=(Math.random()-.5)*28;
 positions[i*3+1]=Math.random()*9;
 positions[i*3+2]=(Math.random()-.5)*28;
}

const particleGeometry=new THREE.BufferGeometry();
particleGeometry.setAttribute(
 "position",new THREE.BufferAttribute(positions,3)
);

const particles=new THREE.Points(
 particleGeometry,
 new THREE.PointsMaterial({
  color:"#c7f5ae",size:.025,transparent:true,opacity:.35
 })
);
scene.add(particles);

// VIEW CONTROLS
document.getElementById("reset").onclick=()=>{
 camera.position.set(12,10,16);
 controls.target.set(0,2,0);
 controls.update();
};

document.getElementById("top").onclick=()=>{
 camera.position.set(0,24,.01);
 controls.target.set(0,0,0);
 controls.update();
};

document.getElementById("front").onclick=()=>{
 camera.position.set(0,6,24);
 controls.target.set(0,3,0);
 controls.update();
};

document.getElementById("fullscreen").onclick=()=>{
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
};

let highQuality=false;

document.getElementById("quality").onclick=()=>{
 highQuality=!highQuality;

 const ratio=highQuality
  ? Math.min(window.devicePixelRatio*2,3)
  : Math.min(window.devicePixelRatio,2);

 renderer.setPixelRatio(ratio);
 renderer.setSize(window.innerWidth,window.innerHeight);

 document.getElementById("quality").textContent=
  highQuality?"Standard Mode":"4K Mode";
};

// DOUBLE CLICK TO FOCUS
renderer.domElement.addEventListener("dblclick",()=>{
 controls.target.set(0,2,0);
});

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

// LIVE ANIMATION
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const t=clock.getElapsedTime();

 particles.rotation.y=t*.008;
 particles.position.y=Math.sin(t*.3)*.08;

 controls.update();
 renderer.render(scene,camera);
}

animate();

document.getElementById("loading").style.display="none"; document.getElementById('status').textContent='● IMMERSIVE LAB READY • 5 SUBJECT ZONES';
</script>
</body>
</html>

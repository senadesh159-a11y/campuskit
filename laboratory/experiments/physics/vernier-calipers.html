
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Lab | Vernier Calipers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:#edf5f5;font-family:Arial,sans-serif}
header{padding:18px 24px;background:#111b22;border-bottom:1px solid #34434c}
main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;padding:18px}
#scene{height: min(65vh,600px);min-height:350px;border:1px solid #34434c;border-radius:14px;overflow:hidden}
.panel{background:#111b22;border:1px solid #34434c;border-radius:14px;padding:18px}
label{display:block;margin:18px 0 8px}
input{width:100%;accent-color:#a3e635}
button{background:#a3e635;color:#101810;border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer;margin-top:12px}
.output{background:#1b2a32;border-radius:8px;padding:12px;margin-top:15px}
small{color:#aab8bf}
@media(max-width:800px){main{grid-template-columns:1fr}#scene{height:50vh}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<header><h2>Physics Laboratory / Vernier Calipers</h2></header>
<main>
<section id="scene"></section>
<aside class="panel">
<h3>Measurement Controls</h3>

<label>Object diameter: <b id="diameterValue">2.36 cm</b></label>
<input id="diameter" type="range" min="0.5" max="4" step="0.01" value="2.36">

<label>Least count: <b id="lcValue">0.01 cm</b></label>
<input id="lc" type="range" min="0.01" max="0.1" step="0.01" value="0.01">

<label>Zero error: <b id="zeroValue">0.00 cm</b></label>
<input id="zero" type="range" min="-0.10" max="0.10" step="0.01" value="0">

<div class="output">
<p>Main scale reading: <b id="msr">—</b></p>
<p>Vernier coincidence: <b id="vc">—</b></p>
<p>Observed reading: <b id="observed">—</b></p>
<p>Corrected reading: <b id="corrected">—</b></p>
</div>
<button id="reset">Reset</button>
<p><small>Rotate and zoom the instrument. Change the object diameter to observe the measurement.</small></p>
</aside>
</main>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const container=document.getElementById("scene");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101c24);

const camera=new THREE.PerspectiveCamera(45,container.clientWidth/container.clientHeight,.1,100);
camera.position.set(0,2.5,7);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(container.clientWidth,container.clientHeight);
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x263746,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(3,5,4);
scene.add(light);

const metal=new THREE.MeshStandardMaterial({color:0xaab8bd,metalness:.8,roughness:.25});
const dark=new THREE.MeshStandardMaterial({color:0x253640,metalness:.4});
const objectMat=new THREE.MeshStandardMaterial({color:0xa3e635,metalness:.2,roughness:.3});

function box(w,h,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);scene.add(m);return m;
}

// Main scale body
box(5.4,.18,.35,0,0,0,metal);
box(5.4,.035,.37,0,-.12,0,dark);

// Scale markings
for(let i=0;i<=50;i++){
 const x=-2.5+i*.1;
 const height=i%10===0?.22:i%5===0?.15:.08;
 box(.018,height,.025,x,.09,.19,metal);
}

// Sliding vernier body
const slider=new THREE.Group();
scene.add(slider);
const jaw=box(.16,1.0,.35,-2.5,.48,0,metal);
slider.add(jaw);
const upperJaw=box(.16,.85,.35,-2.5,1.30,0,metal);
slider.add(upperJaw);
const vernier=box(1.0,.12,.35,-2.0,.24,0,metal);
slider.add(vernier);

// Vernier markings
for(let i=0;i<=10;i++){
 const tick=box(.018,.16,.025,-2.45+i*.09,.36,.19,dark);
 slider.add(tick);
}

// Fixed jaw
box(.16,1.0,.35,-2.68,.48,0,metal);
box(.16,.85,.35,-2.68,1.30,0,metal);

// Object being measured
const object=new THREE.Mesh(
 new THREE.CylinderGeometry(.25,.25,.7,48),
 objectMat
);
object.rotation.x=Math.PI/2;
object.position.set(-1.7,.65,.45);
scene.add(object);

function update(){
 const diameter=Number(document.getElementById("diameter").value);
 const lc=Number(document.getElementById("lc").value);
 const zero=Number(document.getElementById("zero").value);

 document.getElementById("diameterValue").textContent=diameter.toFixed(2)+" cm";
 document.getElementById("lcValue").textContent=lc.toFixed(2)+" cm";
 document.getElementById("zeroValue").textContent=zero.toFixed(2)+" cm";

 // Illustrative scale reading calculation
 const observed=Math.round(diameter/lc)*lc;
 const msr=Math.floor(observed*10)/10;
 const coincidence=Math.round((observed-msr)/lc);
 const corrected=observed-zero;

 document.getElementById("msr").textContent=msr.toFixed(2)+" cm";
 document.getElementById("vc").textContent=coincidence;
 document.getElementById("observed").textContent=observed.toFixed(2)+" cm";
 document.getElementById("corrected").textContent=corrected.toFixed(2)+" cm";

 // Move slider and object to illustrate jaw opening
 const opening=.8+diameter*.28;
 slider.position.x=opening;
 object.scale.setScalar(diameter/2.36);
 object.position.x=-1.7+opening*.2;
}

["diameter","lc","zero"].forEach(id=>{
 document.getElementById(id).addEventListener("input",update);
});

document.getElementById("reset").onclick=()=>{
 document.getElementById("diameter").value=2.36;
 document.getElementById("lc").value=.01;
 document.getElementById("zero").value=0;
 update();
};

window.addEventListener("resize",()=>{
 camera.aspect=container.clientWidth/container.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(container.clientWidth,container.clientHeight);
});

update();

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>

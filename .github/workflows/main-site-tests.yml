name: CampusKit main-site regression tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "api/**"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/main-site-tests.yml"
  pull_request:
    paths:
      - "index.html"
      - "api/**"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/main-site-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CampusKit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
